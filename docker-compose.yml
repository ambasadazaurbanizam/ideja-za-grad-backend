version: '3.4'

services:
  db:
    image: postgres:17-alpine
    container_name: postgres-local
    env_file:
      - .env.db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: build-stage
    container_name: backend-local
    env_file:
      - .env
      - .env.db
    ports:
      - "8080:8080"
    volumes:
      - ./static:/app/static
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
